<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Formularz DEMO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .demo {
      padding: 12px;
      margin-bottom: 20px;
      background: #fff1c7;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
    }

    .section {
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="demo">
    DEMO – PROJEKT SZKOLNY
  </div>

  <h1>Dane dokumentu</h1>

  <div class="section">Dane osobowe</div>

  <label for="name">Imię</label>
  <input id="name" type="text" placeholder="np. Anna">

  <label for="surname">Nazwisko</label>
  <input id="surname" type="text" placeholder="np. Kowalska">

  <label for="nationality">Obywatelstwo</label>
  <input id="nationality" type="text" placeholder="np. POLSKIE">

  <label for="birthDate">Data urodzenia</label>
  <input id="birthDate" type="date">

  <label for="pesel">PESEL – fikcyjny</label>
  <input id="pesel" type="text" placeholder="dane demonstracyjne">

  <label for="gender">Płeć</label>
  <select id="gender">
    <option value="">Wybierz</option>
    <option value="KOBIETA">Kobieta</option>
    <option value="MĘŻCZYZNA">Mężczyzna</option>
  </select>

  <label for="lastName">Nazwisko rodowe</label>
  <input id="lastName" type="text">

  <label for="placeOfBirth">Miejsce urodzenia</label>
  <input id="placeOfBirth" type="text">

  <div class="section">Rodzice</div>

  <label for="fathername">Imię ojca</label>
  <input id="fathername" type="text">

  <label for="fatherSurname">Nazwisko ojca</label>
  <input id="fatherSurname" type="text">

  <label for="mothername">Imię matki</label>
  <input id="mothername" type="text">

  <label for="motherSurname">Nazwisko matki</label>
  <input id="motherSurname" type="text">

  <div class="section">Adres</div>

  <label for="address">Adres</label>
  <input id="address" type="text" placeholder="np. ul. Przykładowa 1">

  <label for="postalcode">Kod pocztowy</label>
  <input id="postalcode" type="text" placeholder="00-000">

  <div class="section">Dokument DEMO</div>

  <label for="do_idSeries">Seria i numer – fikcyjne</label>
  <input id="do_idSeries" type="text" placeholder="DEMO000000">

  <label for="do_issueDate">Data wydania</label>
  <input id="do_issueDate" type="date">

  <label for="do_expiryDate">Data ważności</label>
  <input id="do_expiryDate" type="date">

  <label for="registrationDate">Data zameldowania</label>
  <input id="registrationDate" type="date">

  <button type="button" id="saveButton">
    Zapisz dane DEMO
  </button>

  <a class="back" href="dowod.html">
    Wróć do dokumentu DEMO
  </a>

</div>

<script>
  function saveData() {

    const fields = [
      "name",
      "surname",
      "nationality",
      "birthDate",
      "pesel",
      "gender",
      "lastName",
      "placeOfBirth",
      "fathername",
      "fatherSurname",
      "mothername",
      "motherSurname",
      "address",
      "postalcode",
      "do_idSeries",
      "do_issueDate",
      "do_expiryDate",
      "registrationDate"
    ];

    fields.forEach(function(id) {
      const element = document.getElementById(id);

      if (element) {
        localStorage.setItem(id, element.value);
      }
    });

    alert("Dane DEMO zostały zapisane.");

    window.location.href = "dowod.html";
  }

  document
    .getElementById("saveButton")
    .addEventListener("click", saveData);
</script>

</body>
</html>
