<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme-init.js"></script>
  <title>Aktywacja</title>

  <style>
    :root {
      color-scheme: light;
      --bg:
        radial-gradient(820px 520px at 8% -10%, rgba(248,113,113,.26), transparent 65%),
        radial-gradient(640px 420px at 95% 10%, rgba(190,18,60,.18), transparent 60%),
        #f8fafc;
      --card:#fff;
      --text:#0b1020;
      --muted:#475569;
      --border:rgba(15,23,42,.16);
      --primary:#b91c1c;
      --primary-strong:#991b1b;
      --primary-soft:rgba(185,28,28,.2);
      --danger:#b42318;
      --hint:#64748b;
      --shadow:0 28px 60px rgba(15,23,42,.16);
    }

    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:
        radial-gradient(820px 520px at 10% -15%, rgba(248,113,113,.22), transparent 65%),
        radial-gradient(640px 420px at 90% 0%, rgba(190,18,60,.16), transparent 62%),
        #0b1220;
      --card:#0c1729;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --border:rgba(148,163,184,.24);
      --primary:#f87171;
      --primary-strong:#ef4444;
      --primary-soft:rgba(248,113,113,.22);
      --danger:#f87171;
      --hint:#94a3b8;
      --shadow:0 28px 60px rgba(0,0,0,.55);
    }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--bg);
      font-family:"Roboto","Segoe UI",Arial,sans-serif;
      color:var(--text);
      position:relative;
      padding:20px 0;
    }

    .card {
      width:min(92vw,480px);
      max-width:100%;
      background:var(--card);
      border-radius:24px;
      padding:clamp(20px,5vw,30px);
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      animation:rise .5s ease;
      box-sizing:border-box;
    }

    h1 {
      margin:0 0 8px;
      font-size:clamp(22px,5vw,26px);
      letter-spacing:.3px;
    }

    p {
      margin:0 0 18px;
      color:var(--muted);
      font-size:clamp(14px,3.5vw,16px);
    }

    label {
      font-size:clamp(13px,3vw,14px);
      font-weight:600;
      display:block;
      margin-bottom:6px;
      text-align:left;
    }

    input[type="text"] {
      width:100%;
      padding:12px 14px;
      font-size:15px;
      border-radius:14px;
      border:1px solid var(--border);
      outline:none;
      background:transparent;
      color:var(--text);
      letter-spacing:.6px;
      box-sizing:border-box;
    }

    input[type="text"]:focus {
      border-color:var(--primary);
      box-shadow:0 0 0 4px var(--primary-soft);
    }

    button {
      margin-top:14px;
      width:100%;
      padding:12px;
      font-size:15px;
      font-weight:700;
      border-radius:999px;
      border:none;
      background:linear-gradient(120deg,var(--primary),var(--primary-strong));
      color:#fff;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(15,23,42,.2);
      box-sizing:border-box;
    }

    button:disabled {
      opacity:.7;
      cursor:default;
    }

    .input-wrapper {
      display:flex;
      gap:8px;
      align-items:flex-start;
    }

    .input-wrapper input[type="text"] {
      flex:1;
    }

    .paste-button {
      margin-top:0;
      width:auto;
      padding:12px 20px;
      font-size:14px;
      flex-shrink:0;
      background:var(--card);
      color:var(--text);
      border:1px solid var(--border);
      box-shadow:0 2px 6px rgba(15,23,42,.1);
    }

    .message {
      margin-top:14px;
      font-size:14px;
      color:var(--danger);
      word-break:break-word;
    }

    .hint {
      margin-top:6px;
      font-size:12px;
      color:var(--hint);
      text-align:left;
    }

    .theme-toggle {
      position:fixed;
      top:16px;
      right:16px;
      width:38px;
      height:38px;
      padding:0;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      font-size:18px;
      cursor:pointer;
      box-sizing:border-box;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    @keyframes rise {
      from {
        opacity:0;
        transform:translateY(10px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }

    @media (max-width:480px) {
      .theme-toggle {
        top:12px;
        right:12px;
        width:34px;
        height:34px;
        font-size:16px;
      }

      .card {
        border-radius:20px;
      }
    }
  </style>

  <link rel="manifest" href="manifest.json">
  <script src="js/theme.js" defer></script>
</head>

<body>

<button
  id="themeToggle"
  class="theme-toggle"
  type="button"
  aria-label="Przełącz motyw">
  ☀️
</button>

<main class="card">
  <h1>Aktywacja dostepu</h1>

  <p>Wpisz klucz aktywacyjny otrzymany od administratora.</p>

  <form id="activateForm">

    <label for="keyInput">Klucz dostepu</label>

    <div class="input-wrapper">

      <input
        id="keyInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        placeholder="XXXX-XXXX-XXXX-XXXX"
        required
      >

      <button
        id="pasteButton"
        type="button"
        class="paste-button">
        Wklej
      </button>

    </div>

    <div class="hint">Format: 16 znakow</div>

    <button id="activateButton" type="submit">
      Aktywuj
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite">
    </div>

  </form>
</main>

<script>
  const ACCESS_CODE = "1111-1111-1111-1111";

  const form = document.getElementById("activateForm");
  const input = document.getElementById("keyInput");
  const button = document.getElementById("activateButton");
  const pasteButton = document.getElementById("pasteButton");
  const message = document.getElementById("message");
  const themeToggle = document.getElementById("themeToggle");

  function normalizeKey(value) {
    return value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .match(/.{1,4}/g)
      ?.join("-") || "";
  }

  function getTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark"
      ? "dark"
      : "light";
  }

  function updateThemeButton() {
    themeToggle.textContent = getTheme() === "dark" ? "🌙" : "☀️";
  }

  themeToggle.addEventListener("click", () => {
    const next = getTheme() === "dark" ? "light" : "dark";

    if (window.Theme && typeof window.Theme.setMode === "function") {
      window.Theme.setMode(next);
    } else {
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme-preference", next);
    }

    updateThemeButton();
  });

  pasteButton.addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      input.value = text.trim();
      input.focus();
    } catch {
      message.textContent = "Nie można wkleić.";
    }
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    message.textContent = "";

    const enteredCode = normalizeKey(input.value);

    if (enteredCode !== ACCESS_CODE) {
      message.textContent = "Klucz jest niepoprawny.";
      return;
    }

    button.disabled = true;
    button.textContent = "Aktywowano";

    localStorage.setItem("activation-complete", "1");
    localStorage.setItem("moj_tajny_klucz", enteredCode);
    localStorage.setItem(
      "data_aktywacji",
      new Date().toLocaleString("pl-PL")
    );

    document.cookie =
      "app_device_ok=1; path=/; max-age=31536000; SameSite=Lax";

    setTimeout(() => {
      window.location.replace("login.html");
    }, 300);
  });

  updateThemeButton();
</script>

</body>
</html>
